<div class="barre-filtres" [class.recherche-ouverte]="rechercheOuverteMobile()">
  <!-- 🔍 Recherche -->
  <div class="recherche-wrapper" [class.ouverte]="rechercheOuverteMobile()">
    <button
      type="button"
      class="recherche-icone-btn"
      (click)="toggleRechercheMobile($event)"
      aria-label="Rechercher"
    >
      <svg
        class="recherche-icone"
        width="15"
        height="15"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <circle cx="11" cy="11" r="8" />
        <path d="m21 21-4.35-4.35" />
      </svg>
    </button>
    <input
      #rechercheInput
      class="recherche-input"
      type="text"
      placeholder="Rechercher un quartier..."
      [value]="etat().recherche"
      (input)="onRecherche($any($event.target).value)"
    />
    @if (rechercheOuverteMobile()) {
      <button
        type="button"
        class="recherche-fermer-btn"
        (click)="fermerRechercheMobile($event)"
        aria-label="Fermer la recherche"
      >
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </button>
    }
  </div>

  <div class="separateur"></div>

  <!-- 📍 Quartier -->
  <div class="filtre-btn-wrapper">
    <button
      class="filtre-btn"
      [class.actif]="etat().quartier"
      [class.ouvert]="isOpen('quartier')"
      (click)="toggleDropdown('quartier', $event)"
    >
      <svg class="btn-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z" />
        <circle cx="12" cy="10" r="3" />
      </svg>
      <span class="filtre-label">{{ etat().quartier ?? 'Quartier' }}</span>
      <svg
        class="chevron"
        [class.rotate]="isOpen('quartier')"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
      >
        <polyline points="6 9 12 15 18 9" />
      </svg>
    </button>

    @if (isOpen('quartier')) {
      <div class="dropdown">
        @for (q of quartiers; track q) {
          <button
            class="dropdown-item"
            [class.selectionne]="etat().quartier === q"
            (click)="selectionnerQuartier(q)"
          >
            @if (etat().quartier === q) {
              <span class="check">✓</span>
            }
            {{ q }}
          </button>
        }
      </div>
    }
  </div>

  <!-- 🏠 Type -->
  <div class="filtre-btn-wrapper">
    <button
      class="filtre-btn"
      [class.actif]="etat().type"
      [class.ouvert]="isOpen('type')"
      (click)="toggleDropdown('type', $event)"
    >
      <svg class="btn-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
        <polyline points="9 22 9 12 15 12 15 22" />
      </svg>
      <span class="filtre-label">{{ etat().type ?? 'Type' }}</span>
      <svg
        class="chevron"
        [class.rotate]="isOpen('type')"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
      >
        <polyline points="6 9 12 15 18 9" />
      </svg>
    </button>

    @if (isOpen('type')) {
      <div class="dropdown">
        @for (t of typeOptions; track t) {
          <button
            class="dropdown-item"
            [class.selectionne]="etat().type === t"
            (click)="selectionnerType(t)"
          >
            @if (etat().type === t) {
              <span class="check">✓</span>
            }
            {{ t }}
          </button>
        }
      </div>
    }
  </div>

  <!-- 💰 Budget -->
  <div class="filtre-btn-wrapper">
    <button
      class="filtre-btn"
      [class.actif]="etat().budget"
      [class.ouvert]="isOpen('budget')"
      (click)="toggleDropdown('budget', $event)"
    >
      <svg class="btn-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="1" x2="12" y2="23" />
        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
      </svg>
      <span class="filtre-label">{{ etat().budget ?? 'Budget' }}</span>
      <svg
        class="chevron"
        [class.rotate]="isOpen('budget')"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
      >
        <polyline points="6 9 12 15 18 9" />
      </svg>
    </button>

    @if (isOpen('budget')) {
      <div class="dropdown">
        @for (b of budgets; track b) {
          <button
            class="dropdown-item"
            [class.selectionne]="etat().budget === b"
            (click)="selectionnerBudget(b)"
          >
            @if (etat().budget === b) {
              <span class="check">✓</span>
            }
            {{ b }}
          </button>
        }
      </div>
    }
  </div>

  <div class="separateur"></div>

  <!-- 📍 Proche de moi (GPS) -->
  <div class="filtre-btn-wrapper">
    <button
      class="filtre-btn proximite-btn"
      [class.actif]="etat().proximite"
      [class.chargement]="gpsEnCours()"
      [disabled]="gpsEnCours()"
      (click)="toggleProximite()"
      title="Trier par distance"
    >
      @if (gpsEnCours()) {
        <span class="spinner"></span>
      } @else {
        <svg
          class="btn-icone"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="12" cy="12" r="3" />
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3" />
          <path
            d="m4.93 4.93 2.12 2.12M16.95 16.95l2.12 2.12M4.93 19.07l2.12-2.12M16.95 7.05l2.12-2.12"
          />
        </svg>
      }
      <span class="filtre-label">{{ gpsEnCours() ? 'Localisation…' : 'Proche de moi' }}</span>
    </button>
  </div>

  <!-- Reset -->
  @if (nbFiltresActifs() > 0) {
    <button
      class="reset-btn"
      (click)="reinitialiser()"
      title="Réinitialiser"
      [attr.data-count]="nbFiltresActifs()"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        width="13"
        height="13"
      >
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
        <path d="M3 3v5h5" />
      </svg>
      <span class="reset-label">Effacer ({{ nbFiltresActifs() }})</span>
    </button>
  }
</div>
